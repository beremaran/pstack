name: Validate skills and packaging

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate skills and host manifests
        run: python scripts/validate-skills.py
      - name: Test the upstream updater
        run: python scripts/test-upstream.py
      - name: Test the supervisor
        run: python -m unittest discover -s skills/pstack-runtime/scripts -p 'test_*.py'
      - name: Validate the Claude plugin and marketplace
        run: npx -y @anthropic-ai/claude-code@2 plugin validate .
